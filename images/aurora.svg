<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Aurora borealis over mountains">
  <defs>
    <linearGradient id="auroraSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1c" />
      <stop offset="0.55" stop-color="#152a5e" />
      <stop offset="1" stop-color="#26548c" />
    </linearGradient>
    <linearGradient id="auroraGlow" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0" />
      <stop offset="0.45" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="auroraGlow2" x1="1" y1="1" x2="0.2" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0" />
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.7" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132043" />
      <stop offset="1" stop-color="#05080f" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#auroraSky)" />

  <g fill="#ffffff" opacity="0.85">
    <circle cx="90" cy="70" r="1.8" />
    <circle cx="180" cy="130" r="1.3" />
    <circle cx="260" cy="60" r="1.6" />
    <circle cx="410" cy="100" r="1.2" />
    <circle cx="520" cy="55" r="1.7" />
    <circle cx="640" cy="120" r="1.3" />
    <circle cx="720" cy="70" r="1.9" />
    <circle cx="330" cy="170" r="1.1" />
    <circle cx="600" cy="185" r="1.4" />
  </g>

  <circle cx="668" cy="96" r="34" fill="#f8fafc" opacity="0.95" />
  <circle cx="668" cy="96" r="34" fill="none" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" />

  <path d="M-60 400 C 110 180, 250 420, 420 210 S 690 300, 870 150" fill="none"
        stroke="url(#auroraGlow)" stroke-width="70" stroke-linecap="round" />
  <path d="M-60 320 C 150 230, 300 380, 480 250 S 730 230, 870 320" fill="none"
        stroke="url(#auroraGlow2)" stroke-width="34" stroke-linecap="round" opacity="0.9" />

  <path d="M0 500 L0 400 L130 300 L250 400 L360 320 L500 430 L620 350 L760 440 L800 410 L800 500 Z"
        fill="url(#mountains)" />
  <path d="M120 305 L130 300 L140 306 L134 316 L126 316 Z" fill="#e2e8f0" opacity="0.75" />
  <path d="M352 325 L360 320 L370 328 L362 338 L354 336 Z" fill="#e2e8f0" opacity="0.7" />
