<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Sunset over the sea">
  <defs>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a55" />
      <stop offset="0.45" stop-color="#c2410c" />
      <stop offset="0.72" stop-color="#fb923c" />
      <stop offset="1" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" />
      <stop offset="0.35" stop-color="#7c2d12" />
      <stop offset="1" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
    <clipPath id="sunClip">
      <rect x="0" y="0" width="800" height="340" />
    </clipPath>
  </defs>

  <rect width="800" height="340" fill="url(#sunsetSky)" />
  <rect y="340" width="800" height="160" fill="url(#sea)" />

  <g clip-path="url(#sunClip)">
    <circle cx="400" cy="340" r="105" fill="url(#sun)" />
  </g>

  <g opacity="0.55">
    <ellipse cx="400" cy="150" rx="330" ry="16" fill="#fda4af" />
    <ellipse cx="230" cy="215" rx="200" ry="12" fill="#fdba74" />
    <ellipse cx="590" cy="255" rx="240" ry="11" fill="#fcd34d" />
  </g>

  <g fill="#1c1917" opacity="0.55">
    <rect x="60" y="368" width="680" height="3" rx="1.5" />
    <rect x="120" y="392" width="560" height="3" rx="1.5" />
    <rect x="40" y="420" width="720" height="3" rx="1.5" />
    <rect x="150" y="450" width="500" height="3" rx="1.5" />
    <rect x="90" y="474" width="620" height="3" rx="1.5" />
  </g>

  <g fill="#0c0a09">
    <path d="M0 340 L0 300 L70 258 L140 300 L140 340 Z" />
    <path d="M640 340 L640 292 L710 250 L800 300 L800 340 Z" />
  </g>
</svg>
